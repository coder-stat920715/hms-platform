server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USER:hms}
    password: ${DB_PASSWORD:hms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/hms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

hms:
  notification:
    mode: ${NOTIFICATION_MODE:log}           # log | aws
    from-email: ${NOTIFICATION_FROM:no-reply@hms.example.com}
    pharmacy-alert-email: ${PHARMACY_ALERT_EMAIL:pharmacy-alerts@hms.example.com}

resilience4j:
  circuitbreaker:
    instances:
      ses: { sliding-window-size: 20, minimum-number-of-calls: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      sns: { sliding-window-size: 20, minimum-number-of-calls: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
  retry:
    instances:
      ses: { max-attempts: 4, wait-duration: 500ms }    # full-jitter backoff installed by RetryJitterConfig
      sns: { max-attempts: 4, wait-duration: 500ms }

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
